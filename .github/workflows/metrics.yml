# Renders the profile cards with lowlighter/metrics.
#
# Upstream metrics is unmaintained, so each card step runs a locally built,
# patched image (see .github/metrics/README.md). Every card is rendered with
# plugins_errors_fatal so a broken plugin fails loudly instead of committing an
# "Unexpected error" card; the cards that did render are still committed.
name: Metrics

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC (midnight in Toronto during DST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build patched metrics image
        run: docker build -t metrics:3.35.0-beta .github/metrics

      # ----------------------------------------------------------------------
      # Cards. Each step shares the same boilerplate:
      #   output_action: none     -> write to /metrics_renders only, commit below
      #   use_prebuilt_image: no  -> makes the action reuse metrics:3.35.0-beta
      #   plugins_errors_fatal    -> fail the step rather than render an error
      # ----------------------------------------------------------------------
      - name: Header
        id: header
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: header.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: header
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes

      - name: Notable contributions
        id: notable
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: notable.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          plugin_notable_types: commit, pull_request, issue

      - name: Achievements
        id: achievements
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: achievements.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      - name: Languages
        id: languages
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: languages.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          plugin_languages_analysis_timeout: 30

      - name: Repositories and lines of code
        id: repositories
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: repositories.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: repositories
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Contribution calendar
        id: isocalendar
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Coding habits
        id: habits
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: habits.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      - name: Activity and community
        id: activity
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: activity.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: activity, community
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes

      - name: Issues and pull requests
        id: followup
        continue-on-error: true
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master, 2023-12-18
        with:
          filename: followup.svg
          token: ${{ secrets.METRICS_SECRET }}
          user: zvonkok
          template: classic
          base: ""
          config_timezone: America/Toronto
          output_action: none
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

      # ----------------------------------------------------------------------
      # Commit whatever rendered, then surface any failed card.
      # ----------------------------------------------------------------------
      - name: Commit refreshed cards
        run: |
          set -euo pipefail
          ls -l /metrics_renders
          sudo cp /metrics_renders/*.svg .
          sudo chown "$(id -u):$(id -g)" ./*.svg
          git add -- '*.svg'
          if git diff --cached --quiet; then
            echo "No card changed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(metrics): refresh cards $(date -u +%Y-%m-%d)"
          git push

      - name: Fail if any card failed to render
        if: ${{ contains(steps.*.outcome, 'failure') }}
        run: |
          echo "::error::At least one card failed to render; see the failed step(s) above."
          exit 1
